# OUR single-drone GOAL config for drone_1 — derived 2026-10-07 from CMU's goal_single.yaml
# (which ships as drone_2 at 10 m/s). Lab-validated values from the previous branch:
#   hover z 0.5 m · land_speed_mps 0.6 · fence ±2 m XY / 0–2 m Z · speeds 1.0
# keep_in fence (brake at the wall, no latch) is NEW on this branch — ⏳ STE (MILESTONES M4).
#
#   ros2 launch svg_ground_control ground_control.launch.py \
#       config:=$(ros2 pkg prefix svg_ground_control)/share/svg_ground_control/config/goal_single_ours.yaml \
#       use_mocap:=true use_foxglove_studio:=true
# then takeoff -> start -> goals on /svg/drone_1/goal_command (or the Basestation Goal card).

swarm_commander:
  ros__parameters:
    drone_names: ["drone_1"]
    drone_modes: "real"
    teleop_drones: ""
    external_drones: ""
    cbf_exempt_drones: ""

    scenario: "goal"
    scenario_speed_mps: 1.0      # live: ros2 param set /swarm_commander scenario_speed_mps X
    goal_accel_mps2: 3.0         # live. CMU flies 10; start gentle
    goal_settle_s: 0.3
    goal_lead_m: 2.0
    goal_velocity_only_settle_s: 1.0
    arena_low: [-1.5, -1.5, 0.5]
    arena_high: [1.5, 1.5, 1.8]
    drone_position_offsets: [0.0, 0.0, 0.0]
    # takeoff target = initial goal, ABSOLUTE mocap coords — place the drone here on the floor
    hover_positions: [-0.5, 0.0, 0.5]

    state_topic_template: "/{name}/odometry_conversion/odometry"

    control_rate_hz: 20.0
    hover_kp: 1.0
    arrival_threshold_m: 0.15
    land_speed_mps: 0.6          # validated 2026-09-03
    takeoff_speed_mps: 0.5
    hold_lead_m: 0.2
    land_complete_altitude_m: 0.15

    cbf_safety_radius_m: 0.55
    cbf_max_speed_mps: 1.0
    cbf_alpha: 2.5
    teleop_max_speed_mps: 0.5
    teleop_accel_mps2: 5.0

    # keep_in: the drone brakes before the wall instead of freezing. Box validated 2026-09-03.
    fence_enabled: true
    fence_behavior: "keep_in"
    fence_brake_accel_mps2: 4.0  # live; keep >= goal_accel_mps2
    fence_keep_in_gain: 2.0      # live; CMU: keep 2 on the trajectory output
    fence_margin_m: 0.0
    fence_min: [-2.0, -2.0, 0.0]
    fence_max: [2.0, 2.0, 2.0]
    teleop_fence_enabled: false

mocap_bridge:
  ros__parameters:
    drone_names: ["drone_1"]
    mocap_topic_template: "/{name}/pose"
    px4_vio_mode: "direct"
    px4_vio_frame: "enu_to_ned"
    vio_quality: 100
    px4_vio_topic_template: "/{name}/fmu/in/vehicle_visual_odometry"
    visual_odometry_topic_template: "/{name}/fmu/visual_odometry_in"
    mocap_frame: "map"
    velocity_filter_alpha: 0.4
    mocap_qos_best_effort: false

led_controller:
  ros__parameters:
    drone_names: ["drone_1"]
    default_color: "green"
    cbf_color: "red"
    cbf_hold_s: 0.5
    brightness: 80
    heartbeat_port: 47901
