# OUR hover / first-flight config for ONE Starling (drone_1) — derived 2026-10-07 from
# CMU's swarm_real.yaml (3 drones) and goal_single.yaml (1 drone), carrying the values
# this lab validated on the previous branch (2026-09-01→03):
#   hover z 0.5 m · land_speed_mps 0.6 · fence ±2 m XY / 0–2 m Z · cbf_max_speed 1.0
# Everything here is ⏳ STE on this branch (MILESTONES M3). Record changes in CONFIG.md.
#
#   ros2 launch svg_ground_control ground_control.launch.py \
#       config:=$(ros2 pkg prefix svg_ground_control)/share/svg_ground_control/config/swarm_real_ours.yaml \
#       use_mocap:=true use_foxglove_studio:=true

swarm_commander:
  ros__parameters:
    drone_names: ["drone_1"]
    drone_modes: "real"
    teleop_drones: ""
    external_drones: ""
    cbf_exempt_drones: ""

    scenario: "hover"
    scenario_speed_mps: 0.5
    scenario_seed: 7
    arena_low: [-1.5, -1.5, 0.5]
    arena_high: [1.5, 1.5, 1.8]
    # mocap anchors the EKF to the shared mocap origin -> zero offset is CORRECT
    drone_position_offsets: [0.0, 0.0, 0.0]
    # takeoff target AND hold point, ABSOLUTE mocap coords — place the drone here on the floor
    hover_positions: [-0.5, 0.0, 0.5]

    state_topic_template: "/{name}/odometry_conversion/odometry"
    teleop_topic_template: "/svg/{name}/teleop_command"

    control_rate_hz: 20.0
    state_timeout_s: 0.5
    teleop_timeout_s: 0.5

    hover_kp: 1.0
    arrival_threshold_m: 0.15
    land_speed_mps: 0.6          # validated 2026-09-03 (0.3 left the drone armed on the ground)
    takeoff_speed_mps: 0.5
    hold_lead_m: 0.2
    land_complete_altitude_m: 0.15

    cbf_safety_radius_m: 0.55
    cbf_max_speed_mps: 1.0
    cbf_alpha: 2.5
    teleop_max_speed_mps: 0.5

    # Geofence: hold_all for the first flights (breach -> freeze, ~/reset_fence to clear).
    # Box = the one validated in flight on 2026-09-03. Must fit INSIDE the net.
    fence_enabled: true
    fence_behavior: "hold_all"
    fence_brake_accel_mps2: 4.0
    fence_keep_in_gain: 1.0
    fence_margin_m: 0.0
    fence_min: [-2.0, -2.0, 0.0]
    fence_max: [2.0, 2.0, 2.0]
    teleop_fence_enabled: false

mocap_bridge:
  ros__parameters:
    drone_names: ["drone_1"]
    mocap_topic_template: "/{name}/pose"       # from ./mocap.sh on the laptop
    px4_vio_mode: "direct"
    px4_vio_frame: "enu_to_ned"                 # verified by the frame hand-check (previous branch)
    vio_quality: 100
    px4_vio_topic_template: "/{name}/fmu/in/vehicle_visual_odometry"
    visual_odometry_topic_template: "/{name}/fmu/visual_odometry_in"
    mocap_frame: "map"
    velocity_filter_alpha: 0.4
    mocap_qos_best_effort: false

led_controller:
  ros__parameters:
    drone_names: ["drone_1"]
    default_color: "green"
    cbf_color: "red"
    cbf_hold_s: 0.5
    brightness: 80
    heartbeat_port: 47901
