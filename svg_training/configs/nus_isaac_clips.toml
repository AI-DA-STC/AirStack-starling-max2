# Second set (owner, 18 Nov 2026 evening: "record more Isaac Lab clips of NUS's policy, including in the props and construction-site worlds").
# Same row-6 game, same hangar geometry (its arena fits the site's clear patch: corners 5.3 m from the centre, patch 10.4 m), recorded with
# `--out runs/nus_port/isaac_clips_more`. Optional keys (scripts/nus_isaac_clips.py docstring): scene, props_seed, props_count, caption,
# candidate_games (the first paired starts played in the dry run; it costs per tick, not per game), kinds (the games to record, in order).
# Candidates follow row 6's own per-game results (runs/nus_port/phase4/row_6/per_game.npz): G19 v S20 held 21 of 1,000 games, the first at
# paired start 77 (index 76); the other pairs' first games are Strike wins. A hold costs a full 120 s game (2,400 ticks) in the dry run and again
# on camera. Visual only: props and site are nothing the game senses.

