[figure]
# The ladder figure (plan D8): Strike reach rate with its Wilson 95 % interval for the core pairs, one panel per Strike player.
size_in = [11.0, 4.0]
dpi = 150
offset = 0.06                      # horizontal spacing of the four Guard players inside a row's slot
row_order = ["1", "2.1", "2.2", "2", "3a", "3", "4", "5a", "5", "6"]
