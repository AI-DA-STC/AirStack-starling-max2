# Gates for porting the partner's (NUS) area-denial strategy. Approved by the owner on 17 November 2026 ("i approve
# all the questions u ask me earlier"); written here before each gate's run and never moved (STANDARDS §7).
# Tolerances and counts only: no partner value appears in this file. Partner values live in the git-ignored
# configs/local/nus_rules*.toml (STANDARDS §2 privacy; tests/test_nus_rules_privacy.py).

[gates.phase2_replica_parity]
# Our batched replica reproduces the partner's 2-D game step by step (scripts/nus_record_fixtures.py recordings).
cases = ["gate_3v3", "gate_5v3"]          # recordings under runs/nus_port/fixtures/ (git-ignored)
episodes_per_case = 100
max_position_error_units = 1.0e-4          # every drone, every step, replica state reset to the recorded one each step
reached_step_must_match = true             # the sticky reached flag first fires on the same step
min_steps_per_rule = 1                     # push, team cap, total cap, Guard boundary and reached flip each exercised
open_loop_drift = "INFO"                   # full-episode drift without per-step reset is reported, not gated

[gates.phase3_converted_policy]
# The converted PyTorch actor reproduces the partner's JAX actor.
observations_per_team = 10000
max_action_error_units_per_step = 0.02     # bfloat16 trunk in the partner's code
games_per_opponent = 1000
outcome_parity = "strike_reach_rate_within_95pct_interval_of_jax"   # opponents: scripted APF and the archive partner

# ---------------------------------------------------------------------------------------------------------------------
# Phase 5 (plan docs/plans/2026-11-18-nus-phase5-retraining.md v3, after the train-gatekeeper reads of v1 and v2: PASS WITH FIXES).
# Written by the lead under the owner's delegation of 18 November 2026 (~12:20, "i follow ur recommendations"; private
# port plan D-P5-5). status = "PROPOSED" until frozen; reference_rebuild, positive_control, negative_control and
# method_match are frozen together before R0 starts, every other table before the first run of the stage it gates, and
# none is moved after (STANDARDS section 7). The tables above are frozen and untouched. Counts, tolerances, rule names,
# source paths and file hashes only: no partner value. Reference numbers are computed by code from the named files
# (git-ignored, home RTX 5090 only), pinned by sha256 here and copied into each stage's runs/nus_port/phase5/<stage>/gates.toml.

[gates.phase5_reference_rebuild]
# R0: NUS's own hangar self-play lineages converted and scored at our game count, before any Phase 5 gate is used.
status = "FROZEN 2026-11-18 16:20 (gatekeeper PASS on plan v3.1; lead, owner-delegated)"
reference_runs = ["2026-11-17_selfplay_3v3_seed1", "2026-11-17_selfplay_3v3_seed2", "2026-11-17_selfplay_3v3_seed3"]   # NUS outputs/hangar/
generations = [1, 8]                        # inclusive: archive entries per lineage (Guard 1, 3, 5, 7; Strike 2, 4, 6, 8)
conversion_gate = "phase3_converted_policy" # gate (a) applies to every converted entry, unchanged
max_failed_conversions = 2                  # more stop the stage; a failed entry leaves its panel (all arms alike)
engine = "replica"                          # the Phase 2 replica (ledger T15), PyTorch
games_per_pairing = 1000
starts = "shared"                           # one start set drawn once by the replica's random start rule, used by every pairing
starts_seed = 20261120
action_mode = "deterministic"               # both teams take their mean action
output = "runs/nus_port/phase5/reference/matrix_1000.json"
jax_crosscheck = "INFO"                     # NUS's own evaluator at the same count, per-cell differences reported only
loo_check = "each NUS entry inside the envelope of the other entries of its team (rule c of phase5_method_match); any miss makes statistic c INFO"
may_change = "only statistic c of phase5_method_match, from gate to INFO, through loo_check"

[gates.phase5_positive_control]
# C0: NUS's code with three new run seeds, scored by the frozen phase5_method_match rule in place of our lineages.
status = "FROZEN 2026-11-18 16:20 (gatekeeper PASS on plan v3.1; lead, owner-delegated)"
seeds = [101, 201, 301]                     # stage seed = run seed + generation - 1: no collision with the reference lineages
command = "the reference command of ~/nus_jax_runs/2026-11-17_hangar_selfplay_3v3_seed1.cmd.txt with the seed and hydra.run.dir changed, through run_nus_job.sh"
required_verdict = "PASS"
on_fail = "stop; a new gate version (a new table) is written and read by train-gatekeeper, then a fresh positive control with new seeds, before phase5_method_match is scored"
on_inconclusive = "scoring is deterministic, so no re-score: NUS's code runs followup_seeds; all six lineages are scored once with a Welch interval on d; the spread rule then gives FAIL, not INCONCLUSIVE; final"
followup_seeds = [401, 501, 601]            # stage seeds 401-408, 501-508, 601-608: no collision with reference, C0, N0 or ours
videos = "NUS eval.py, two games per archived entry"

[gates.phase5_negative_control]
# N0: untrained actors (one fresh initialisation per generation slot, no training) scored as the 'ours' arm.
status = "FROZEN 2026-11-18 16:20 (gatekeeper PASS on plan v3.1; lead, owner-delegated)"
seeds = [7001, 8001, 9001]
rule = "phase5_method_match"
required_verdict = "FAIL"
required_failures = "both 5.1-d intervals exclude 0"
a_completion = "not applicable to N0"
b_pool = "the pool the selection rule would have built from the earlier N0 entries of the other team plus APF"
record = "verdict of every statistic a to d"
on_other = "stop before phase5_method_match is scored: the rule cannot catch a learner that learned nothing"

[gates.phase5_method_match]
# Stage 5.1: our PyTorch copy of NUS's alternating best-response MAPPO with the archive pool, against NUS's lineages.
status = "FROZEN 2026-11-18 16:20 (gatekeeper PASS on plan v3.1; lead, owner-delegated)"
seeds = [1001, 2001, 3001]                  # spaced like the positive control's (no shared stage seed)
generations = 8
team_size = "3v3"
engine = "replica"
observation_layout = "nus_area_denial_v1"
reference = "phase5_reference_rebuild"      # same engine, starts, game count and action mode
games_per_pairing = 1000
confidence = 0.95
a_completion = "every seed archives every generation; non-finite aborts = 0"
b_learner_window = [1, 6]                   # generations checked
b_failed_generation_max_worst_win = 0.5     # archived best's worst win rate against its own training pool (APF included), re-scored at games_per_pairing
b_max_consecutive_failed_same_team = 1      # two consecutive failed same-team generations in the window fail the seed; every seed must pass
c_scripted_columns = "each of our entries' win rate against the other team's APF lies inside [lowest Wilson lower bound, highest Wilson upper bound] of the reference entries of its team"
d_statistics = ["guard_mean_hold_vs_other_lineage_strikes", "strike_mean_reach_vs_other_lineage_guards"]   # APF excluded
d_our_seed_value = "mean over the three leave-one-out panels (each panel: the NUS entries of two reference lineages)"
d_reference_seed_value = "each reference lineage against the entries of the other two"
d_failed_conversion = "the entry leaves its panel; the lineage mean uses the remaining entries; same for reference, positive and negative control"
d_test = "pooled two-sample t interval of (our seed mean - reference seed mean)"
d_t_quantile = 2.776                        # two-sided 95 %, 4 degrees of freedom
d_sd = "sample standard deviation with n - 1"
d_sd_floor = 0.02                           # applied to each arm's standard deviation before pooling and before the spread ratio
d_pass = "the interval contains 0"
d_spread_ratio_max = 4.36                   # sqrt(19): one-sided 5 % point of F(2, 2) on the variance ratio; 2.0 would flag about 0.36 across the two statistics
verdict_order = "FAIL if a, b or c (when gated) fails, or either d interval excludes 0; otherwise INCONCLUSIVE if either d spread ratio (ours / reference, floored) > d_spread_ratio_max; otherwise PASS. INCONCLUSIVE only replaces a PASS"
followup_seeds = [4001, 5001, 6001]         # after an INCONCLUSIVE, exactly these three more seeds of ours
followup_rule = "all six seeds scored once: a to c over six, d with a Welch interval (Welch-Satterthwaite degrees of freedom); the spread rule then gives FAIL, not INCONCLUSIVE; the verdict is final"
e_info = ["last_mover_share", "near_shutout_share", "generalist_band", "jax_vs_replica_cells", "curves"]
videos = "one replica game per selection evaluation; two per archived entry"

[gates.phase5_method_variants]
# 5.1b and 5.1c: the same rule on two batch shapes; their verdicts only choose the batch shape of stage 5.2.
status = "PROPOSED"
rule = "phase5_method_match"
seeds = [1001, 2001, 3001]
run_after = "phase5_method_match PASS"
games_per_update = 16384
updates_per_generation = { s51b = 47, s51c = 16 }   # s51b: the copied method's episodes per generation; s51c: a third
minibatch = "the copied method's minibatch size in samples and its epochs, so s51b keeps its gradient steps per generation"
selection_evaluations_after_update = { s51b = [16, 32, 47], s51c = [8, 16] }
choice = "stage 5.2 uses the cheapest variant whose verdict is PASS (INCONCLUSIVE counts as not PASS); none PASS: stage 5.2 keeps the copied batch shape and its budget goes back to the owner"
videos = "one replica game per selection evaluation; two per archived entry"

