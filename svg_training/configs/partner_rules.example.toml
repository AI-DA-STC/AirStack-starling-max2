# Copy to configs/local/partner_rules.toml and put the partner values there; never commit them.
# Only these keys are accepted from the local file.

[partner_rules]
keepout_guard_m = 1.10
keepout_strike_m = 1.10
push_rule = "block"                # "block" | "shove"
teammates_pass = true
win_steps_in_zone = 1
strike_units_per_step = 0.025
guard_units_per_step = 0.016666666666666666
game_steps = 1200
metres_per_unit = 1.0
seconds_per_step = 0.05

[arena]
zone_radius_frac = [0.10, 0.25]
