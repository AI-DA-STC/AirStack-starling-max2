# S2 game settings: neutral committed defaults. The partner's real numbers live only in the git-ignored
# configs/local/partner_rules.toml (see partner_rules.example.toml).

[game]
preset = "partner"                 # "partner" | "contact"
dropout_fraction = 0.0
obs_view = "full"
pad_guards = 5
pad_strikes = 3
yaw_rate_max_rad_s = 1.0

[arena]
band_weights = [1.0, 1.0, 1.0]
zone_radius_frac = [0.10, 0.25]
zone_wall_margin_m = 0.5
height_band_m = [0.5, 1.8]
start_height_m = 1.2
walls = "keep_in"                  # "keep_in" | "leave"
wall_margin_m = 0.25

[arena.bands_m]
lab = [4.0, 6.0]
middle = [6.0, 10.0]
large = [10.0, 16.0]

[partner_rules]
keepout_guard_m = 1.10             # the flight stack's keep-out, not a partner value
keepout_strike_m = 1.10
push_rule = "block"                # "block" | "shove"
teammates_pass = true
win_steps_in_zone = 1
strike_units_per_step = 0.025      # 0.5 m/s with metres_per_unit and seconds_per_step below
guard_units_per_step = 0.016666666666666666   # 0.025 / 1.5
game_steps = 1200
metres_per_unit = 1.0
seconds_per_step = 0.05

[contact_rules]
contact_m = 0.50
guard_survives_tag_prob = 0.0

[starling_layer]
enabled = false
params = "params/real_exploratory_v0.toml"
filter_iterations = 1000
filter_check_every = 0

[starts]
mode = "rings"                     # "rings" | "anywhere"
strike_inset_m = 0.3
guard_ring_gap_m = 0.3
spacing_m = 1.2

[rewards]
win = 1.0
shaping_weight = 0.0
