# Still frames for documents, taken while a clip is recorded (same run, same game): view "wide" = the clip's camera,
# "high" = steeper and further out, "close" = near the drones (looks at the live drones' centre). elevation_deg,
# distance_scale and lookat_lift_m, if given, override the clip camera's for the still.
[[stills]]
name = "s2b_still_5v3_site_wide"
clip = "s2b_5v3_site"
at_s = 6.0
view = "wide"
elevation_deg = 24.0
distance_scale = 2.0
lookat_lift_m = 2.0

