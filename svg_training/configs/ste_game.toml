# STE learning track: the game spec sheet as settings (task L0.8). The sheet for readers is ste_learning/GAME_SPEC.md;
# tests/test_ste_game_spec.py keeps its table and this file equal, value for value and label for label.
#
# The sheet LISTS, it does not decide (PLAN.md section 4, row L0.8). The game does not read this file. [tag_rule] below
# records the tag rule (the main game has a 1-for-1 tag since gate G0, owner, 22 Nov 2026); [tag] (task L0.9) lists the
# game's own switch for the tag, as a game file sets it ([tag],
# core/game_config.py TagCfg): the values here are the code's defaults, and tests/test_ste_game_spec.py keeps them equal.
# The same holds for [starts] (the game's start mode "zone_disc_ring", StartsCfg, task L0.10) and [players] (the scripted
# players' settings, opponents/scripted.py, task L0.10).
#
# One value per line: key = value   # LABEL (source): text. LABEL is FIXED, MEASURED, PROPOSED or OPEN, as defined at
# the top of ../STANDARDS.md; ste_learning/STANDARDS.md section 1: never upgrade a label without the owner. An OPEN line
# carries the value used today for reference only: no run of record may depend on it. Loaded by
# source/svg_training/ste/game_spec.py (frozen; an unknown or missing key, a wrong type or a missing label raises).
#
# Where the values come from: the track starts from the game of the STE Guard policy (T41), the hangar game of NUS port
# Phase 4 row 5 (DISCUSSION section 2.4), except where PLAN.md section 4, L0.11 base case, sets another value (the
# 6.5 m lab arena). Hangar values are what source/svg_training/nus/hangar.py geometry() computes from the git-ignored
# configs/local/nus_rules.toml and nus_deploy.toml (NUS agreed its settings may be published: owner decision 6,
# 18 Nov 2026); a test checks them against those files when they are installed.

[zone]
shape = "circle"                  # FIXED (parent STANDARDS section 4 "Teams", programme benchmark): the Guard team holds a circular zone
scored_in = "horizontal_plane"    # PROPOSED (parent STANDARDS section 4 "Height"; core/game.py:314-315 tests the horizontal distance only): a vertical cylinder through the height band
radius_m = 1.6                    # FIXED (owner, G0, 22 Nov 2026, P12, G0 ruling R5; OPEN until then, DISCUSSION section 3): zone radius 1.6 m; zone = tag = 1.6 m accepted as tested in L0; hangar: nus_rules.toml area_radius x nus_deploy.toml metres_per_unit; equals the tag radius (F2)
centre = "arena_centre"           # PROPOSED (hangar game, nus/hangar_game.py _draw_arenas; PLAN is silent; kept, LEAD CALL 20 Nov 2026): the S2 game draws the centre per game instead
win_ticks_inside = 1              # PROPOSED (parent STANDARDS section 4 "Strike scores"; s2_game.toml and nus_hangar_game.toml [partner_rules] win_steps_in_zone): one Strike drone inside for one tick wins

[height]
band_m = [0.5, 1.8]               # PROPOSED (parent STANDARDS section 4 "Height"; s2_game.toml and nus_hangar_game.toml [arena] height_band_m): the same heights as the lab's goal box, goal_two_ours.yaml arena_low/high (MEASURED)
mode = "free"                     # PROPOSED (DISCUSSION sections 2.4 and 2.6: T41's game, Phase 4 row 5, height "free_jitter" in nus_phase4.toml): drones move freely inside the band
start_m = 1.2                     # PROPOSED (nus_deploy.toml flying_height_m; s2_game.toml [arena] start_height_m): row 5 adds a 1 mm start jitter (nus_phase4.toml [ladder] jitter_m)

[arena]
side_m = 6.5                      # FIXED (owner, G0, 22 Nov 2026, G0 ruling R9; F8; PLAN section 4 L0.11 base case "the 6.5 m lab arena"): the 6.5 m square, the lab fence, 6.5 x 6.5 x 4 m (parent STANDARDS section 4, MEASURED, goal_two_ours.yaml fence_min/max); the hangar side (configs/local/nus_hangar.toml) is the other size L0.11 swept
wall_margin_m = 0.25              # PROPOSED (s2_game.toml and nus_hangar_game.toml [arena] wall_margin_m): the keep-in limit is half the side less this
walls = "keep_in"                 # PROPOSED (s2_game.toml and nus_hangar_game.toml [arena] walls; core/game.py:296-299 holds a drone at the wall; the lab fence too, goal_two_ours.yaml fence_behavior): a drone at a wall is held, not out
environment = "open_arena"        # FIXED (owner, G0, 22 Nov 2026, P10, G0 ruling R11; OPEN until then): E0 open arena until a trained team passes the opponent panel, then E1 (random blocks and columns), then E2 (the construction-site world); the parent FIXED rule "Environments" (realistic 3-D worlds, construction site first) stands, E0 is its first build step

[starts]
guard_disc_m = 0.8                # PROPOSED (hangar game: nus_rules.toml start_guard_disc_fraction x area_radius x nus_deploy.toml metres_per_unit; nus/replica.py reset): Guards uniform in radius inside this disc round the zone centre (hangar game); the game's [starts] mode (QC fix round 1) puts two or more Guards on one evenly spaced circle inside it where they fit, see team_spacing_margin_m; "zone_disc_ring" (L0.10, core/game_config.py StartsCfg) has this default
strike_ring_m = 2.75              # FIXED (owner, G0, 22 Nov 2026, G0 ruling R9; before: LEAD CALL 21 Nov 2026, L08-F1, task L0.10, ruled at G0 with the arena, F8): the hangar ring (nus_deploy.toml spawn_distance x metres_per_unit, 3.2 m, random bearings) scaled by the arena half-side, 3.2 x 3.25 / 3.75 = 2.77, rounded down to 2.75; fits the 6.5 m arena's keep-in limit (3.0 m) on every bearing with 0.25 m to spare, 1.15 m outside the zone edge, 1.95 m from the Guard disc (more than the tag radius: no tag at the first step); the default of the game's [starts] mode "zone_disc_ring"
team_spacing_margin_m = 0.05      # PROPOSED (LEAD CALL 21 Nov 2026, L0.10 QC fix round 1, finding I1): in the game's [starts] mode "zone_disc_ring" team-mates start at least the filter distance (1.1 m) + this apart, so the filter pushes nobody into the other team's tag range at the start; Guards evenly spaced on one circle per game (random rotation), radius uniform from the chord radius (spacing / (2 sin(pi / Guards)): 0.66 m for 3, 0.98 m for 5) up to the Guard disc where it fits, else the chord radius; Strikes on the ring at random gaps of at least that spacing

[timing]
game_s = 120.0                    # FIXED (owner, G0, 22 Nov 2026, G0 ruling E; before: hangar game nus_rules.toml episode_steps x nus_deploy.toml seconds_per_step, 2,400 ticks, kept by LEAD CALL 20 Nov 2026): 120 s for the main game; shorter clocks only as training experiments; the S2 game plays 60 s (s2_game.toml game_steps x seconds_per_step)
decision_s = 0.6                  # PROPOSED (nus_deploy.toml seconds_per_step, hold 12 ticks; T41; DISCUSSION section 2.10): the S2 game decides every 0.05 s tick

[speeds]
strike_mps = 0.5                  # FIXED (owner, 15 Nov 2026; parent STANDARDS section 4 "Speeds in metres per second"): the real stick cap
strike_to_guard_ratio = 1.5       # FIXED (parent STANDARDS section 4 "Speed ratio", NUS partner page): the Guard team flies at Strike speed / 1.5

[teams]
of_interest = ["2v1", "5v3"]      # FIXED (parent STANDARDS section 4 "Team sizes of interest", programme simulation page): Guard drones first
target_sizes = ["1v1", "2v1", "3v3", "5v3"]   # FIXED (owner, G0, 22 Nov 2026, P9, G0 ruling R6-8; OPEN until then): train 3v3, plus the 1v1 reads in L1; every trained team is also scored at 2v1 and 5v3 (the programme's sizes of interest); random team size in L2 as planned
base_case = "3v3"                 # FIXED (owner, G0, 22 Nov 2026, G0 ruling R6-8: train 3v3; PLAN section 4 L0.11 base case; hangar game: nus_rules.toml guard_count, strike_count)

[tag_rule]
main_game_has_tag = true          # FIXED (owner, G0, 22 Nov 2026, P1, G0 ruling R1, DISCUSSION section 14): the main game has a 1-for-1 tag; this overturns the earlier FIXED "no tag" (owner, 14 and 15 Nov 2026; parent STANDARDS section 4 "Tag"); the contact-tag side quest is unchanged
radius_m = 1.6                    # FIXED (owner, G0, 22 Nov 2026, P1, option (d); DISCUSSION section 2.9): 1.6 m for building the pipeline and the first demo; a 1.15 m side track in L1-L2 and 1.15 m main training after L2; a Guard drone and a Strike drone whose 3-D centres are closer both leave; the filter distance plus 0.5 m
pairing = "nearest_pair_1for1"    # FIXED (owner, G0, 22 Nov 2026, P1, G0 ruling R1; PLAN section 4 L0.9, F5): 1-for-1: one Guard drone tags at most one Strike drone, nearest pair first; today's contact_tags lets one Guard tag every Strike in range (core/pair_rules.py:60-70)
guard_survives_tag_prob = 0.0     # FIXED (owner, G0, 22 Nov 2026, D2, G0 ruling R4; P12 asked what a tag costs, both ends swept in L0.11): both drones leave; D2 is no longer provisional; the parent row "After a tag, Guard drone" says the same

[tag]
mode = "off"                      # FIXED (owner, G0, 22 Nov 2026, P1, G0 ruling R1): the switch stays a per-file setting; off is the code default and this file's default value (the pre-tag game bit for bit, which golden tests rely on); the track's game files (configs/ste_l011/*.toml and later) set "nearest_pair_1for1"; the main game has the tag since the G0 ruling (tag_rule.main_game_has_tag)
radius_m = 1.6                    # FIXED (owner, G0, 22 Nov 2026, P1, option (d): 1.6 m to build the pipeline, a game file may set 1.15 m; equals tag_rule.radius_m): the tag's distance between 3-D centres; a pair strictly closer tags
guard_survives_tag_prob = 0.0     # FIXED (owner, G0, 22 Nov 2026, D2, P12, G0 ruling R4: both drones leave; equals tag_rule.guard_survives_tag_prob): drawn per game at its start from the tag's own random stream; 0 = both drones out

[filter]
pairs = "every_pair"              # FIXED (owner, 14 and 15 Nov 2026; parent STANDARDS section 4 "Safety filter in the game" and section 5 "Safety filter in flight today"): Guard-Guard, Strike-Strike and Guard-Strike pairs
share = "equal"                   # MEASURED (read from AirStack/robot/ros_ws/src/svg_ground_control/svg_ground_control/cbf_filter.py:150-152, 339-341 and DISCUSSION section 2.9 desk run; lead, 20 Nov 2026: not FIXED without the owner): each pair's correction split evenly between the two drones; option B, only the Guard drone swerves, is P2, PROPOSED, ruled at the L2 gate
keepout_m = 1.1                   # FIXED (parent STANDARDS section 5: safety radius 0.55 m in the _ours configs, cbf_filter.py): centre to centre

[players]
guard_park_ring_m = 0.8           # PROPOSED (PLAN section 2 F1, lead's geometry script 20 Nov 2026: three Guards parked on a 0.8 m ring cover the whole zone, worst gap 1.53 m; task L0.10): the smallest ring of the scripted Guard player guard_parked_ring (opponents/scripted.py GuardParkedRing.RING_M), stations a whole turn / team size apart, fixed by Guard index; LEAD CALL 21 Nov 2026: the ring grows to keep neighbours the filter distance + 0.05 m apart (5 Guards: 0.98 m)
