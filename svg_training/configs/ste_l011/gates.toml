# ------------------------------------------------------------------------------------------------ the cut
[cut]
# If the projection exceeds the cap: at every boundary between groups the driver projects the effective seconds of
# the groups still to play (seconds per batch tick of the group's size: measured in this run on full-length sweep or
# sensitivity batches only, never on the controls (QC I2), else [projection.seconds_per_batch_tick]) x each group's
# ticks x batches, times safety_factor, plus the clip reserve, and drops whole sweep groups from the END of the run
# order until it fits the cap left. If the protected groups alone do not fit, the run refuses with exit 2 before play
# (QC I3; H6), at the first launch and at every boundary. So the
# cut order is: arena_7p5, zone_2p4, tag_1p8, tag_1p4, tag_1p2, survive_1, size_5v3, size_2v1, size_1v1,
# sens_strike_dz_1mm (one batch, run before the team sizes because it is cheap; cut last). The base case
# and the controls are never cut. A cut group is listed in results.md and the record; a group is never half played
# by plan (the cap stop, exit 3, can still end one).
protected = ["ctl_tag_fires_2v1", "ctl_tag_fires_3v3", "ctl_tag_fires_5v3", "ctl_reach_fires_1v1", "ctl_reach_fires_3v3",
             "base", "ctl_same_seed", "ctl_stand_still", "ctl_still_1v1", "ctl_still_2v1", "ctl_still_3v3", "ctl_still_5v3",
             "ctl_tiny_tag", "ctl_tag_off"]
safety_factor = 1.1

[projection.seconds_per_batch_tick]
# LEAD CALL 21 Nov 2026: the GPU pilot's 30-cell points (30,000 games per batch, all five Guard scripts), run folder
# runs/2026-11-21_ste_l011_pilot (ste-l0.11 at ed2f7fd1, laptop RTX 5070 Ti, remote-desktop service also on the GPU),
# pilot.md. Projection there at 30 cells per batch: 19 batches, 0.75 GPU-h; 0.99 GPU-h with the 1.1 factor and the
# clip reserve, against the 3.0 GPU-h cap. MEASURED (200 timed ticks per point).
"1v1" = 0.0321557
"2v1" = 0.0428184
"3v3" = 0.0743015
"5v3" = 0.137539

# ------------------------------------------------------------------------------------------------ the controls
[controls]
# Known answers; checked by the driver as soon as their cells exist, written to controls.json and printed first in
# results.md. stop_on_fail: a failed control stops the run at once (checkpoint kept; exit 6 CONTROL_FAILED, terminal,
# never retried: the same command on the same run folder ends with 6 again; LEAD CALL 21 Nov 2026).
stop_on_fail = true
# same_seed_twice (group ctl_same_seed): batch 0 of the base case played again from the same seed, in the same run.
# Known answer: per game, the outcome, the end step, the Strike drones tagged, the Strike drones left and the start
# positions are equal; the closest 3-D approach is equal within same_seed_closest_tol_m. On the CPU the tolerance is 0
# (bit for bit, CODING_PRACTICES section 5); on CUDA bit identity is not claimed, so the closest approach has this
# tolerance, while every count above must still be equal.
same_seed_closest_tol_m = 1e-6
# stand_still_never_reaches (group ctl_stand_still): Strike drones that command zero start 2.75 m from the zone centre
# (1.15 m outside the zone edge). Known answer: no game is reached (reach count 0 in every cell).
# stand_still_zero_tags (groups ctl_still_1v1, _2v1, _3v3 and _5v3, every swept size; lead, 21 Nov 2026, after L0.10's QC found team-mates
# starting inside the filter distance and the filter push tagging drones nobody moved): every drone of both teams
# commands zero, the study tag on (1.6 m). Known answer: 0 tags in the first `ticks` ticks (200 = 10 s), every game.
# zero_tags (groups ctl_tiny_tag and ctl_tag_off): the 0.05 m tag radius lies far inside the 1.10 m filter distance,
# and with the tag off no tag exists. Known answer: 0 tags in every game.
# tag_fires (groups ctl_tag_fires_2v1, _3v3, _5v3; QC C1, a known NON-ZERO answer): tag radius 10 m, larger than the
# 6.5 m arena's 9.2 m diagonal, both teams still. Known answer, every game: tags = min(G, S), Guard drones removed =
# Strike drones tagged, and the game ends at step 1 with a Guard win. Played at 2v1 and 5v3 too: at 3v3 a broken
# 1-for-1 rule (one Guard tags every Strike in range) is invisible.
# reach_fires (groups ctl_reach_fires_1v1, _3v3; QC C1, a known NON-ZERO answer): zone 2.4 m, tag off, still Guards
# against strike_straight. A still Guard inside the 0.8 m start circle is at least 1.6 m from a Strike at the 2.4 m zone
# edge, so the 1.10 m filter cannot block it. Known answer: a reach in every game.
# Checked on every batch of every group (global):
#   tags_one_for_one (QC I1): every game, Guard drones tagged = Strike drones tagged; at guard_survives_tag_prob 0 also
#     Guard drones removed by a tag = Strike drones tagged. (The old "tags <= min(G, S)" could not fail at G >= S.)
#   paired_starts: within a group every cell starts its 1,000 games from the same positions; and every group with the
#     same team size and the same start settings (arena side, Guard disc, Strike ring) has the same starts (base,
#     the tag variants, survive_1, zone_2p4 and the 3v3 controls share one set; sizes and arena_7p5 have their own).
#   no_nonfinite_actions: no player produced a NaN or infinite action (else exit 5, as scripts/score.py refuses).
global_checks = ["tags_one_for_one", "paired_starts", "no_nonfinite_actions"]

# ------------------------------------------------------------------------------------------------ the shortlist rule
[shortlist]
# Written before any result. The base case always goes to L0.12 as the reference for the proposed 1.6 m rules (P1),
# even when the rule below would rule it out: it is then reported as "reference, ruled out because ...". The rule adds
# at most max_variants - len(always) = 2 more, so L0.12 runs at most 3 variants (LEAD CALL 21 Nov 2026).
# Candidates are the RULE variants (one factor changed against the base, plus the base
# itself); team sizes are P9, the owner's at gate G0: they are reported with the same numbers but never shortlisted.
# A variant is a candidate only if all its cells were played (none cut, none stopped).
#
# For a candidate v, over its matrix of scripted Guards g x scripted Strikes s (hold + reach = 1 per cell: every game
# ends in a hold, by time-out or by tagging every Strike drone, or in a reach):
#   H(v) = max over g of min over s of hold(g, s)     the best scripted Guard's worst-case hold (maximin);  g* = argmax
#   R(v) = max over s of min over g of reach(g, s)    the best scripted Strike's worst-case reach (maximin); s* = argmax
#   d(v) = min(1 - H(v), 1 - R(v))                    how far the game is from one side owning a dominant script
# (H + R <= 1 always, by the minimax inequality.) Point estimates of the 1,000-game rates.
# Rule:
#   1. not eligible if H(v) >= trivial_at (a scripted Guard already holds against every scripted Strike: Guard-trivial
#      looking) or R(v) >= trivial_at (a scripted Strike already reaches against every scripted Guard). trivial_at 0.8
#      is a SCREEN on point estimates against scripted players, stricter than L0.12's rule (a Wilson bound on a
#      best-response exploiter): it excludes more often than L0.12 would (LEAD CALL 21 Nov 2026: kept). The base case
#      is carried whatever it says.
#   2. rank the eligible variants not in `always` by d(v), largest first; add at most max_variants - len(always).
#   3. ties, compared on whole games (d in games = min(games - holds of the maximin cell, games - reaches of the
#      maximin cell), integers, so no float edge; LEAD CALL 21 Nov 2026): clusters are ANCHORED on the highest d left:
#      every remaining variant whose d is within tie_window_games (<=, 50 of 1,000 games, about the 95 % noise of a
#      difference of two 1,000-game rates) of that highest d forms one cluster, ordered inside by tie_breaks; then the
#      next cluster is anchored on the highest d left. tie_breaks, in turn:
#      lab_arena_first (the 6.5 m arena before 7.5 m: it is the lab fence), larger_zone_tag_margin (larger
#      |zone radius - tag radius|: F2, a 1v1 at one height is otherwise decided by the tie rule), lower_guard_survives
#      (0 before 1: the D2 value), run_order (the order of [[groups]] above).
#   4. g* and s* of each shortlisted variant are L0.12's "best scripted Guard" and "best scripted Strike"; a tie inside
#      the argmax goes to the higher Wilson lower bound, then to the order in [players].
#   5. sensitivity (INFO, does not change the shortlist): the same rule without the z_up_info columns; if its shortlist
#      differs, results.md and the record say so for the lead.
# Zero eligible variants is itself the finding (H2 soundness, PLAN.md section 7): the lead takes it to the owner.
always = ["base"]
# INFO reference (LEAD CALL 21 Nov 2026, QC M-8): the 30 tag-off base cells (control ctl_tag_off) are reported with H, R
# and d as "no proximity tag" in results.md, the figures (beside the tag radius levels) and the record, marked INFO and
# NEVER shortlisted: the tag rule itself (P1) is the owner's at gate G0.
info_reference = { ctl_tag_off = "no proximity tag" }
candidates = ["base", "tag_1p2", "tag_1p4", "tag_1p8", "zone_2p4", "survive_1", "arena_7p5"]
report_only = ["size_1v1", "size_2v1", "size_5v3"]
max_variants = 3
trivial_at = 0.8
tie_window_games = 50
tie_breaks = ["lab_arena_first", "larger_zone_tag_margin", "lower_guard_survives", "run_order"]

# ------------------------------------------------------------------------------------------------ videos (STANDARDS section 8)
[clips]
# Three replay clips of base-case cells, chosen before the run (not on results): viz/replay.py record_games (CPU, its
# own starts from the clip seed) and render_replay, small GIFs into <run>/videos/. The game shown is the first one
# recorded (lowest game index) that finished.
cells = [["guard_parked_ring", "strike_straight"], ["guard_field", "strike_converge"], ["guard_mark_edge", "strike_sacrifice"]]
group = "base"
games = 2
seed = 110000
max_ticks = 2400
speed = 8                          # game steps per drawn frame: at 10 frames/s, 4 x real time
fps = 10
dpi = 50
# Time kept back for the clips (CPU replay inside the GPU job, billed as GPU time): added to every projection, and the
# clips are skipped (and the record says why) if less than this is left of the cap when the cells are done.
reserve_s = 600

