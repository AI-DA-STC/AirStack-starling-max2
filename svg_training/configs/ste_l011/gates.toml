# STE task L0.11 Screening sweep (INFO): the gate file, written before any run (STANDARDS section 7; ste_learning/
# VALIDATION_QC.md section 0). The screen itself has NO pass mark: it is INFO and shortlists at most 3 rule variants for
# L0.12 by the rule in [shortlist], written here before any result exists. What is gated are the CONTROLS: each has a
# known answer, and every one must hold before any result is read (results.md prints them first; the figure script
# refuses to draw while one fails).
#
# The driver scripts/ste_sweep_l011.py copies this file into its run folder at the first launch and records its sha256;
# a relaunch with a different file, or with a game file whose sha256 differs from the one pinned in [games], is refused
# (exit 2). Edit it only BEFORE the sweep's first launch (after the pilot, [run] cells_per_batch and
# [projection.seconds_per_batch_tick] may be filled in); never after a first result.
#
# Labels: every limit and setting here is PROPOSED by the lead's builder; the lead's rulings of 21 Nov 2026 are marked
# LEAD CALL (the owner delegated the gate limits of INFO runs, PLAN.md section 7). QC reviews the gate file, the limits
# trivial_at 0.8 and tie_window_games 50 included, before the launch (LEAD CALL 21 Nov 2026: the lead dispatches it).
# QC fix round 1 (pre-launch QC runs/ste_l11_qc.md, 21 Nov 2026): C1 known non-zero controls (tag fires, reach fires),
# I1 one-for-one invariant, I2 timing from sweep batches only, I3 refusal when the protected groups cannot fit, I5 tie
# window on whole games, M-10 label; the GPU pilot's numbers below (LEAD CALL 21 Nov 2026).
#
# Run notes (LEAD CALL 21 Nov 2026):
# - NEVER SUSPEND THE MACHINE DURING A GPU JOB (no closed lid, no sleep). The cap clock and the GPU-hour ledger are wall
#   clock less the owner's gpu_pause.sh pauses only: a suspend is counted in full against the cap and billed as GPU-hours
#   (tooling task L07-SUSPEND). To stop using the GPU for a while, pause with scripts/gpu_pause.sh instead.
# - Finding L011-F1: the scripted players decide every tick (0.05 s), not at the sheet's 0.6 s decision period
#   (timing.decision_s; tests/test_ste_l011.py proves one decision per tick). This sweep measures scripted play at
#   0.05 s. L0.12's trainers must fix their decision period explicitly (T41's recipe used 12 ticks = 0.6 s).
# Simulator: training simulator, tier 1 (fast engine), Starling layer on: commander copy, safety filter on every pair
# (1000 sweeps, check every 8), fitted PX4 response (exploratory). Results are "observed in the training simulator".

[run]
task = "L0.11"
kind = "INFO"
seed = 110000                      # game seed of every batch (starts: one draw of games_per_cell, tiled); players seed + 101 / + 202
games_per_cell = 1000              # PLAN.md L0.11 and VALIDATION_QC section 0 rule 2: at least 1,000 games per condition
cells_per_batch = 30               # LEAD CALL 21 Nov 2026 from the GPU pilot (runs/2026-11-21_ste_l011_pilot, commit ed2f7fd1, laptop RTX 5070 Ti): 30,000 games per batch, peak reserved 0.63 GiB at 3v3, 0.80 GiB at 5v3
ticks_cap = 2400                   # = the game length (120 s of 0.05 s ticks): no game is cut short
device = "cuda"
cap_check_every_ticks = 100        # the cap clock (it reads the pause logs) is read every this many ticks; the stop flag every tick
require_projection = true          # QC I3: refuse (exit 2) unless [projection.seconds_per_batch_tick] holds every planned size

[players]
# Every Guard script against every Strike script (PLAN.md L0.10 lists these eleven).
guards = ["guard_parked_centre", "guard_parked_ring", "guard_mark_edge", "guard_mirror", "guard_field"]
strikes = ["strike_straight", "strike_flank", "strike_high", "strike_low", "strike_sacrifice", "strike_converge"]
# With one Strike drone these two fly exactly as strike_straight (GAME_SPEC "Scripted players"; tests/test_ste_l011.py
# checks bit-identical actions), so at 1v1 and 2v1 their cells are not played (20 cells saved) and the table says so.
one_strike_duplicates = ["strike_sacrifice", "strike_converge"]
# Columns labelled in every table and figure: the climb and descent go through tier 1's vertical response, which is not
# fitted (configs/s2b.toml step "z_up_info"; T13: a 1 mm height offset flips over/under outcomes on the physics drone).
