# STE task L0.12d Cross-tag check (INFO): the players T46 trained at tag 1.6 m (base) scored in the 1.15 m game
# (configs/ste_l011/tag_1p15.toml). Scoring only, no training. Spec: ste_learning/drafts/L0_12d_CROSS_TAG_SPEC.md (the
# lead, 22 Nov 2026, before any scoring). Driver: scripts/ste_cross_tag_l012d.py; record: scripts/make_ste_l012d_record.py.
#
# Every file the scores depend on is pinned here by sha256 and checked before anything plays (exit 2 on a mismatch).
# T46's run folders are not in git (read only): the driver takes the folder that holds them (--t46-runs-dir).
# The controls (exit 6, terminal, on any failure; no X number is reported):
#   C1  T46's base Guard evaluation batch replayed whole (every cell, the base game): equal to its eval_final.npz game for
#       game (outcome, end step, tags, Strike drones left, start positions exact; closest approach within the L0.11
#       same_seed_closest_tol_m on CUDA, 0 on the CPU: scripts/ste_vid1_capture.py's rule) and the trained cell's holds
#       = guard_holds;
#   C2  the same for T46's base Strike batch, the trained cell's reaches = strike_reaches;
#   C3  every script cell of the 1.15 m batch (the batch that holds X1-X3) equal to the screen reference game for game
#       (outcome, end step, tags, Strike drones left; the reference stores no closest approach) on the reference's starts,
#       and g* v s* at 1.15 m holding screen_holds.
# Values are FIXED (copied from the records named) unless labelled otherwise.

