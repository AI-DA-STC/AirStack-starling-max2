# STE task L0.3 STE Guard policy in tier 2 without retraining (PLAN.md section 4; DISCUSSION P3; WORK_BREAKDOWN L0.3).
# INFO: no gate on the hold rate, no verdict. The [controls] have known answers and stop the run (exit 6) when one fails.
# Read by scripts/ste_transfer_l03.py through source/svg_training/ste/transfer.py (exact keys). Written before any run;
# copied into the run folder and pinned by sha256 at the first launch; never edited after a first result (STANDARDS 7).
# Labels: FIXED, MEASURED, PROPOSED, OPEN (../../STANDARDS.md), LEAD CALL / L0.3 CHOICE for this task's own choices.
#
# The question: does T41 (829 of 1,000 holds against S20 on tier 1, home RTX 5090) keep its hold rate when the drone is
# the Isaac Lab rigid-body Starling (Phase 4 row 6, the game T24 played), on the same 1,000 paired starts, no retraining?
# Arms (scripts/ste_transfer_l03.py): t1_cpu_t41 (CPU, part "cpu"), then on the GPU (part "isaac", one Isaac world of
# 1,000 games x 6 drones): C-0 and C-3 checks (C-3b INFO), t2_parked (control C-2), t2_t41 (the result), t1_cuda_t41
# (INFO). Every record needs C-0, C-1, C-2 and C-3 present and passed (LEAD CALL 21 Nov 2026 (QC L02-6)); a non-finite
# value (exit 5) leaves the run folder ABORTED for good (QC L02-3).

