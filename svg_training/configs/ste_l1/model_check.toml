# STE tasks L1.1 / L1.1b (estimator effect: correlated error, white noise, residual delay) and L1.2 (drag): settings of
# scripts/l1_model_check.py, the GPU check that
# (a) runs the isaac-marked tests of the changed physics path and (b) measures what the effects cost in throughput.
# Labels as in ../../STANDARDS.md. Nothing here is a drone value: the "on" values below only switch the effects on for
# the cost measurement; the Starling's own values are OPEN until L1.3 (params/starling_physics_v1.toml).

[run]
game_file = "configs/ste_l011/base.toml"   # FIXED: the L0.2 speed game (study tag on, every-pair filter); tier 2 = the same with backend "physics", set in code
params_base = "params/starling_physics_v1.toml"   # FIXED: the "off" arm flies this file (all effects 0); the "on" arm a copy with [effects_on] written in
guards = 3                                 # FIXED: the main game's size
strikes = 3
games = 4096                               # FIXED: CODING_PRACTICES section 9, "at 4,096 games"
repeats = 3                                # PROPOSED: off and on alternate on one world, 3 times each
seed = 1100                                # FIXED: game seed (random actions draw from the measuring process's torch seed, seed + repeat)
noise_seed = 7                             # FIXED: the estimator noise's own generators in --smoke's checks (PhysicsDrone noise_seed); the game arms use the game seed (PhysicsLayer, L1.1b)
max_cost_fraction = 0.10                   # PROPOSED: CODING_PRACTICES section 9, "<= 10 % throughput loss"; INFO here, not a gate

[timing]                                   # as configs/s0_benchmark.toml [timing], shorter windows (the cap is 0.2 GPU-h)
warmup_steps = 50
timed_steps = 200
min_warmup_s = 2.0
min_timed_s = 3.0

[effects_on]                               # MADE UP for the cost measurement only, NOT a drone value
state_delay_s = 0.0                        # L1.1b: no delay in the "on" arm. The estimator is modelled as a correlated error (below), not a transport delay: a whole-state delay of 0.10 s and more made the torch-world drone oscillate in a CPU check on 22 Nov 2026 (z loop unstable at about 0.117 s). The residual delay is still checked by [smoke] state_delay_s
state_noise_pos_m = 0.005
state_noise_vel_mps = 0.02
state_noise_att_rad = 0.005
state_noise_rate_rad_s = 0.02
drag_x_n_per_mps = 0.1
drag_y_n_per_mps = 0.1
drag_z_n_per_mps = 0.1
state_error_pos_m = 0.02                   # L1.1b correlated estimate error, MADE UP (as [hover]); L1.3 fits the real values
state_error_pos_tau_s = 0.5
state_error_vel_mps = 0.02
state_error_vel_tau_s = 0.2
state_error_att_rad = 0.005
state_error_att_tau_s = 0.5

[smoke]                                    # --smoke (the isaac-marked test): a few drones on both worlds, effects on
games = 4
state_delay_s = 0.02                       # MADE UP: 4 physics steps (a residual delay, under the 0.05 s limit of params/starling_physics_v1.toml)
ticks = 40                                 # 2 s of a step setpoint
step_m = [0.6, -0.4, 0.2]                  # MADE UP: setpoint offset from the start
noise_ticks = 20
error_ticks = 40                           # 2 s of hover with the correlated error only (L1.1b), [effects_on] sigmas
error_tau_s = 0.02                         # MADE UP, short on purpose: 2 s x 12 drones x 3 axes then hold about 1,790 effective samples per quantity (400 x 12 x 3 x (1 - a) / (1 + a), a = exp(-0.005 / 0.02)), enough for the stationary spread and the lag-1 autocorrelation exp(-dt / tau)
hover_ticks = 200                          # 10 s of hover with the [hover] error values

[hover]                                    # L1.1b hover check (tests/test_estimator_error.py on the CPU, --smoke on Isaac)
# MADE-UP exploratory values, NOT drone values (L1.3 fits them from flight logs): an EKF2 position estimate that
# wanders by about 2 cm with a 0.5 s correlation time, velocity 0.02 m/s with 0.2 s, attitude 0.005 rad (0.3 deg) with
# 0.5 s. Bounds PROPOSED, written before the first run (22-23 Nov 2026) and not tuned to it.
state_error_pos_m = 0.02
state_error_pos_tau_s = 0.5
state_error_vel_mps = 0.02
state_error_vel_tau_s = 0.2
state_error_att_rad = 0.005
state_error_att_tau_s = 0.5
rms_max_m = 0.06                           # PROPOSED: 3-D RMS distance of the TRUE drone from the hover point
max_m = 0.20                               # PROPOSED: largest such distance, any drone, any tick end
tilt_max_rad = 0.10                        # PROPOSED: largest tilt (about 5.7 deg)

[dry_cpu]                                  # --dry-cpu (tests only): the torch world on the CPU, tiny
games = 4
repeats = 1
warmup_steps = 3
timed_steps = 5
min_warmup_s = 0.0
min_timed_s = 0.0
