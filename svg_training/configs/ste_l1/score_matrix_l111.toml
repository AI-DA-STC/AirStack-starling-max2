# Scoring settings of scripts/ste_score_matrix.py (STE L1 side track; spec ste_learning/drafts/L1_SIDE_TRACK_SPEC.md v2,
# item 5), fixed before the scoring. Every file is pinned by sha256 and checked before anything plays (exit 2 on a
# mismatch or a FILL_ value). Controls (exit 6, terminal, no number reported on any failure): own_replay, the player's
# whole evaluation batch replayed equal to its eval_final.npz game for game with its trained cell at own_wins; and per
# scoring game and script x of the other team, every script cell of the batch equal to the reference game for game.
# L1.11: the Strike team trained against guard_field at tag 1.6 m, scored against every Guard script at 1.6 m, worst
# cell first, against the best Strike script on the same starts (T44's cells, replayed). FILL_ values: from the run's
# finished folder before the scoring; the tool refuses until then.

[job]
task = "L1.11"
what = "L1.11's Strike team (trained against guard_field at tag 1.6 m) scored against every Guard script"
kind = "INFO"

[player]
label = "The L1.11 Strike team"
dir = "runs/2026-11-22_ste_l111_strike"
side = "strike"
variant = "base"
gates_sha256 = "84aea8592800f0d3fc205bbf879df9252ce3b6775fe3515b070d73ae9df80ef0"
agent_sha256 = "12a10bf68db580e6a0276dcf34dc1591d4b8086d723f9dbc7ca8a5d13586f406"
