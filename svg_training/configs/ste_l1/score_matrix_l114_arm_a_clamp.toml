# Scoring settings of scripts/ste_score_matrix.py for L1.14, the time-left test (STE L1 side track; spec
# ste_learning/drafts/L1_SIDE_TRACK_SPEC.md, addendum 2), fixed before the scoring. Every file is pinned by sha256 and
# checked before anything plays (exit 2 on a mismatch). The player and the game are pinned exactly as in
# score_matrix_l113_arm_a.toml; only the time-left input the player's network sees is changed ([player] time_left,
# in-game drones only; out-of-game drones keep their zeroed inputs), and only guard_field is scored ([job] opponents;
# the spec's test is against guard_field).
# Controls (exit 6, terminal, no number reported on any failure): own_replay (the player's own evaluation replayed
# WITHOUT the override, equal to its eval_final.npz game for game with its trained cell at own_wins) and the script
# cells of the batch equal to the reference game for game.
# INFO: L1.13 arm A (trained on the 30 s clock, so it never saw a time left above 30 s) in the 120 s game with its
# time-left input clamped to at most 30 s: the fair 120 s read of arm A, beside its plain 120 s score (L1.13). Needs arm
# A's run folder runs/2026-11-22_ste_l113_arm_a in this checkout (pins below; exit 2 if missing or changed).

[job]
task = "L1.14"
what = "INFO: L1.13 arm A in the 120 s game with its time-left input clamped to at most 30 s, against guard_field"
kind = "INFO"
opponents = ["guard_field"]   # PROPOSED (spec addendum 2: the test is against guard_field): a named subset, recorded

[player]
label = "The L1.13 arm A Strike team"
dir = "runs/2026-11-22_ste_l113_arm_a"
side = "strike"
variant = "arm_a_clock30"
gates_sha256 = "e602a4e68553f80e28dca728c6794dd7eec980dc4a33ed176c311516482cfa13"
agent_sha256 = "dd67c35ca69f4f62fe81655c2ebf13fec6f8fb68985e7e0629d44ba400d6ad02"
eval_sha256 = "f1eab4b073c952b6721e42aa16eb8c3b55af0dcb8a1b8eb2ce35245bc5cf6578"
own_wins = 199
own_source = "L1.13 arm A's own evaluation (results.json exploiter k)"
time_left = { clamp_max_s = 30.0 }   # PROPOSED (spec addendum 2, arm A at 120 s): at most the 30 s clock it trained on

[[games]]
name = "tag_1p15_120s"
file = "configs/ste_l011/tag_1p15.toml"
sha256 = "b2e09683f7088964a7d1ca15dfc9c98d1e04c15e96b14196d6971afb75f27580"
reference = "configs/ste_l012b/screen_reference.npz"
reference_sha256 = "49014000d07e8b52ae579deb325dad53d98c5020f533026dfbff778f306b2296"
reference_variant = "tag_1p15"
clock_label = "tag 1.15 m, 120 s clock (2,400 ticks)"
