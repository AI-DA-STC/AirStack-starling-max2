gates_sha256 = "ace5e18d77c214ca0a3e31d3613a20c3291e0f873ff6d1c5b90b8fec246fb592"
agent_sha256 = "6ca45c318389ada0ab741e3ea76acf8feab79f359a94d6abbb12431f3aba846d"
eval_sha256 = "7337ed32e7a4a9d2dc13b7143c365a37171db6150e9b17d00c254de65b07c79d"
own_wins = 103
own_source = "T52 tag 1.15 m Strike v guard_field, reaches (records/2026-11-21_ste_l012b_best_response_record.md)"
time_left = { offset_s = 90.0 }   # PROPOSED (spec addendum 2, C-offset): 30 s game + 90 s = the 120 s game's time left

[[games]]
