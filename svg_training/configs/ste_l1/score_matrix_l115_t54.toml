# Scoring settings of scripts/ste_score_matrix.py for L1.15, the delay check (STE L1 side track; spec
# ste_learning/drafts/L1_SIDE_TRACK_SPEC.md, addendum 3), fixed before the scoring. Every file is pinned by sha256 and
# checked before anything plays (exit 2 on a mismatch). The 1.15 m-trained Guard team, 3x budget (T54) against its training opponent
# strike_straight at the fitted response delay 0.148 s (the existing game, with its screen reference: script cells equal the
# screen game for game, and the player's cell equals its own evaluation, own_cell) and at 0 and 0.30 s (study-only
# parameter files, no screen reference: every cell reported, INFO). Each batch also holds every script of the player's
# team against strike_straight, among them guard_field v strike_straight, the spec's script cell. Per cell: wins with Wilson
# 95 % intervals, how games end, the distance at each tag (minimum, median) and the closest approach of any pair
# (per game min(tag distances, closest approach of pairs never tagged)). The guard_field v strike_straight cell read for
# the delay comparison is the T55 run's copy (score_matrix_l115_t55.toml, cell guard_field v strike_straight of each
# game's batch); the T54 run's copy is not read. Paired counts between delays are not in results: they come from the
# per-game records games/*.npz (same starts, same order; the lead computes them). Each game pins the sha256 of the
# response parameter file its game file names (params_sha256). Controls (exit 6, terminal, no
# number reported): own_replay (the player's own evaluation replayed equal to its eval_final.npz with its trained cell at
# own_wins), the screen comparison at 0.148 s, and the plumbing controls (paired starts, one for one, finite) at 0 and
# 0.30 s. Reading words: the spec, addendum 3.

[job]
task = "L1.15"
what = "delay check: The 1.15 m-trained Guard team, 3x budget (T54) against strike_straight at response delay 0, 0.148 and 0.30 s"
kind = "INFO"
opponents = ["strike_straight"]   # PROPOSED (spec addendum 3: the training opponent only): a named subset, recorded

[player]
label = "The 1.15 m-trained Guard team, 3x budget (T54)"
