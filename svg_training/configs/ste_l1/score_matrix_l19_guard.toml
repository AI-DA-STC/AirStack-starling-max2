# Scoring settings of scripts/ste_score_matrix.py (STE task L1.9; spec ste_learning/drafts/L1_9_10_SPEC.md, written
# before any run). Every file is pinned by sha256 and checked before anything plays (exit 2 on a mismatch or a FILL_
# value). Controls (exit 6, terminal, no number reported on any failure): own_replay (the player's whole evaluation
# batch, on its own no-error scoring game, replayed equal to its eval_final.npz game for game, its trained cell at
# own_wins); per scoring game with a reference, every script cell equal to the reference game for game; per game with
# `reference = false` (the with-error games: the estimate error is drawn per batch slot, so script cells cannot replay a
# reference), the plumbing controls only (paired starts, one for one, finite) and every script cell played in the same
# batch, the best of them the comparison (INFO).
# L1.9: the 1v1 Guard team trained at tag 1.6 m with the nominal estimate error, scored against every Strike script at
# 1v1: (main) on its training game with the error; (INFO) on the no-error game its driver scored it on.
# FILL_ values: from the run's finished folder (and, L1.9, the screen's reference) before the scoring; the tool refuses
# until then. Launch: scripts/ste_job.py launch --task L1.9 --gpu-h 0.15 ... -- scripts/ste_score_matrix.py --settings
# <this file> --run-dir runs/<date>_ste_l19_guard_score --cap-h 0.15 (expected about 0.05 GPU-h: two 1v1 games; L1.12 used 0.019 for one 3v3 game).

[job]
task = "L1.9"
what = "L1.9's 1v1 Guard team (trained at tag 1.6 m with the estimate error) scored against every Strike script, with and without the error"
kind = "INFO"

[player]
label = "The L1.9 1v1 Guard team (tag 1.6 m, estimate error)"
dir = "FILL_RUN_DIR"
side = "guard"
variant = "base_1v1"
gates_sha256 = "FILL_FROM_RUN"
agent_sha256 = "FILL_FROM_RUN"
eval_sha256 = "FILL_FROM_RUN"
own_wins = "FILL_FROM_RUN"
own_source = "FILL_FROM_RUN"

[[games]]
name = "base_1v1_err"
file = "configs/ste_l1/base_1v1_err.toml"
sha256 = "596ace287f1c3f3a072496b747a90b88a897778106483288cda6dbfb4c76a9ed"
reference = false   # with the estimate error: script cells played in the same batch, not compared to a reference (INFO)
params_sha256 = "4c93543f51ab41ea5bb0f81e6d1b0512f662a3e10126ec2d85fc3bb008cecaa2"   # params/real_exploratory_v0.toml, the response file the game file names
clock_label = "1v1, tag 1.6 m, 120 s clock, nominal estimate error (the training game)"

[[games]]
name = "base_1v1"
file = "configs/ste_l011/base.toml"
sha256 = "96e0e7f61a49999da54eee81a544bf64c519cd80833f0dcdfa2a07edfc10cc4d"
reference = "configs/ste_l1/l19_reference.npz"
reference_sha256 = "FILL_AFTER_SCREEN"
reference_variant = "base_1v1"
clock_label = "1v1, tag 1.6 m, 120 s clock, no estimate error (INFO)"
