# STE task L1.8 (main track, INFO): T46's base players re-scored on TIER 2 (the Isaac Lab rigid-body Starling under the
# PX4 1.14 cascade copy) with the L1.1b estimate error off, nominal and conservative. Scoring only, no training.
# Driver: scripts/ste_tier2_score_l18.py; tests: tests/test_ste_tier2_score_l18.py. Written before any run; copied into
# the run folder and pinned by sha256 at the first launch (a changed file needs a new run folder).
# Labels: FIXED (copied from the record named), PROPOSED (L1.8 builder's choice, for the lead), EXPLORATORY (T63).
#
# Conditions (the brief, costed draft row L1.8): (1) off = params/starling_physics_v1.toml, every error key 0 (the
# L1.1b model at 0 = today's tier 2); (2) nominal = T63's proposal; (3) conservative = 2 x T63's sigma, T63's taus;
# (4) tier 1 = T46's and T44's own per-game files (no new run; ctl tier1_replay re-plays this batch's layout on tier 1
# and must equal them game for game, so the tier 1 column is the same games on the same starts).
# One batch layout for every condition and for the tier 1 replay ([cells]): the Guard player against every Strike script,
# every Guard script against the Strike player, then the script cells, then the repeat cells (the same script cells a
# second time, same starts, same seed). One Isaac world of (cells x games) games for the whole run.
#
# Controls (exit 6, terminal, no number reported on a failure; NOT_CHECKED in a smoke):
#   tier1_replay   the batch on tier 1: player cells = the players' eval_info.npz game for game (exact keys, closest
#                  approach within L0.11's same_seed_closest_tol_m on CUDA, 0 on the CPU), script and repeat cells = T44's
#                  reference game for game, the training-opponent cells at own_wins (913, 636); plumbing.
#   condition_<c>  the condition's game differs from configs/ste_l011/base.toml in condition_difference only, its
#                  parameter file is the pinned one, and the parameters it flies (after configs/s2b.toml [physics])
#                  differ from v1's in the state_error_* keys only and equal its file's.
#   physics_agreement_<c>_launch<k>  L0.13's C-1a on the Isaac world, every launch, before the condition's batch.
#   tier2_<c>      the batch ran the physics drone (tier 2), no non-finite wrench or setpoint, plumbing (paired starts,
#                  tags one for one, no non-finite action: NONFINITE = exit 5).
#   repeat_<c>     each repeat cell against its first copy: holds differ by <= repeat_count_tol_games and <=
#                  repeat_differ_tol_games games end otherwise. Gated in gated_repeat_condition only (no error draws);
#                  INFO in the error conditions (each copy draws its own estimate error: the gap is the error's own
#                  game-to-game spread).
#   known_<c>      in known_condition only: known_cell's holds inside T53's Wilson 95 % interval (tier 2, same game,
#                  same starts, v0 = v1 at 0, other world size and process: a band, not game for game; L0.3's C-2 rule).

