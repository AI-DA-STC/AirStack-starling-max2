"L1.8" = 1.2             # PROPOSED (lead's split, costed draft ste_learning/drafts/L1_L9_COSTED_PLAN_DRAFT.md section 3): T46's base policies re-scored on the new tier 2
"L1.9" = 1.9             # PROPOSED (lead's split, costed draft ste_learning/drafts/L1_L9_COSTED_PLAN_DRAFT.md section 3): 1v1 best-response read, plus a scripted 1v1 screen at tag 1.15 m
"L1.10" = 1.2            # PROPOSED (lead's split, costed draft ste_learning/drafts/L1_L9_COSTED_PLAN_DRAFT.md section 3): Tag drawn within 1.5-1.7 m, 3v3, both sides
