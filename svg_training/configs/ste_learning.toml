# STE learning track: the track's own process settings (task L0.1). Loaded by source/svg_training/ste/config.py into
# frozen dataclasses; an unknown section, key or task ID raises, and so does a value of the wrong type. Caps are
# GPU-hours, written as decimals (3.0, not 3).
#
# Every value line carries its status label and its source: FIXED, MEASURED, PROPOSED or OPEN, as defined at the top of
# STANDARDS.md and in ste_learning/STANDARDS.md section 1. tests/test_ste_config.py fails on a line without one.
#
# No game setting lives here: the game's settings are in configs/ste_game.toml (task L0.8 onwards).
#
# Budget sections (gate G0, owner, 22 Nov 2026): the section "budget" holds the caps of phase L0, CLOSED at G0 (13.77 of
# its 19 GPU-h used); it keeps its first name so the L0 tools and tests read its caps as before, and being closed it
# launches nothing. The section "budget_l1_l2" holds the one cap of phases L1 and L2 together and the caps of their
# tasks (L2's task IDs are added when L2 starts). A launch is checked against the section that holds its task. The
# 13.0 is shared by the laptop and the RTX 5090, each with its own ledger: the other machine's hours are added with
# scripts/ste_job.py carry --gpu-h <hours> --note "<machine> <date>" (counted toward the 13.0, not toward a task).

[track]
plan_version = 2         # FIXED (an identifier, not a ruling): the version in PLAN.md's header line (a test reads it)
phase = "L1"             # FIXED (owner, G0, 22 Nov 2026): L1 and L2 approved together at gate G0 (DISCUSSION section 14; PLAN.md section 9); L0 closed

# Phase L0, CLOSED at gate G0 (22 Nov 2026): kept as history.
[budget]
closed = true            # FIXED (owner, G0, 22 Nov 2026): phase L0 closed; its caps stay readable, no L0 task launches
phase_cap_gpu_h = 19.0   # FIXED (owner, 20 Nov 2026): GPU-hour cap of phase L0 (PLAN.md sections 4, 9 and 12); phase closed at G0, 22 Nov 2026

# GPU-hour cap of each task of the phase, in the order of the table in PLAN.md section 4 (the test compares the IDs,
# their order and the caps with that table). The split is the lead's (a LEAD CALL, PLAN.md version 2), not an owner
# ruling: the owner approved the phase cap above. So each line is PROPOSED. The caps may add up to less than the phase
# cap, never to more.
[budget.task_cap_gpu_h]
"L0.1" = 0.0             # PROPOSED (lead's split, PLAN.md section 4): Track set-up: config and test skeleton
"L0.7" = 0.0             # PROPOSED (lead's split, PLAN.md section 4): Process tooling and drills
"L0.8" = 0.0             # PROPOSED (lead's split, PLAN.md section 4): Game spec sheet
"L0.9" = 0.0             # PROPOSED (lead's split, PLAN.md section 4): Tag rule for the study
"L0.10" = 0.0            # PROPOSED (lead's split, PLAN.md section 4): Scripted players for the study
"L0.11" = 0.5            # PROPOSED (lead's split, PLAN.md section 4; LEAD CALL 21 Nov 2026 (L0.12c): task done, cap lowered to its used hours rounded up): Screening sweep (INFO)
"L0.12" = 13.0           # PROPOSED (lead's split, PLAN.md section 4; LEAD CALL 21 Nov 2026 (L0.12c): raised for the owner-approved longer 1.15 m runs): Best-response test
"L0.2" = 0.4             # PROPOSED (lead's split, PLAN.md section 4; LEAD CALL 21 Nov 2026 (L0.12c): task done, cap lowered to its used hours rounded up): Tier 2 speed in contested play
"L0.13" = 1.6            # PROPOSED (lead's split, PLAN.md section 4; LEAD CALL 21 Nov 2026 (L0.12c): task done, cap lowered to its used hours rounded up): Does tier 2 train at all?
"L0.3" = 1.3             # PROPOSED (lead's split, PLAN.md section 4; LEAD CALL 21 Nov 2026 (L0.12c): task done, cap lowered to its used hours rounded up): STE Guard policy in tier 2 without retraining
"L0.4" = 0.2             # PROPOSED (lead's split, PLAN.md section 4): Side-by-side Starling render
"L0.5" = 0.3             # PROPOSED (lead's split, PLAN.md section 4): Starling video look fix
"L0.14" = 0.0            # PROPOSED (lead's split, PLAN.md section 4): Crazyflie route check (task added 20 Nov 2026, owner)
"L0.6" = 0.0             # PROPOSED (lead's split, PLAN.md section 4): Gate G0

# Phases L1 and L2 together (gate G0, owner, 22 Nov 2026): one cap for both, and the cap of each task. The cap is the
# owner's; the task split is the lead's (a LEAD CALL on the costed draft), so each task line is PROPOSED. PLAN.md has no
# L1 task table; the IDs and their order are those of TASK_IDS["L1"] in ste/config.py. The task caps may add up to less
# than the cap (they sum to 9.1 GPU-h; L2's tasks get theirs when L2 starts), never to more.
[budget_l1_l2]
phases = ["L1", "L2"]    # FIXED (owner, G0, 22 Nov 2026): one GPU-hour cap covers phases L1 and L2 together (DISCUSSION section 14)
closed = false           # FIXED (owner, G0, 22 Nov 2026): L1 and L2 approved, phase L1 in work
phase_cap_gpu_h = 13.0   # FIXED (owner, G0, 22 Nov 2026): GPU-hour cap of L1 and L2 together, 12 + one confirming seed (PLAN.md section 9)

[budget_l1_l2.task_cap_gpu_h]
