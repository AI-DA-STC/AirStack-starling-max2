# SIM-ONLY: the AirStack simulator's airframe and plant, for the STE L1.5 comparison only. NEVER a training set, NEVER a
# drone value, NEVER an AirStack change (repository iron rule 9; owner's ruling R21, 24 Nov 2026,
# ste_learning/DISCUSSION_2026-11-19_20.md section 16; STANDARDS section 5 rule 2).
# Read ONLY by scripts/compare_sim_steps.py (load_sim_only_params): the [sim_only] table below makes
# models/physics_params.load_physics_params refuse this file ("unknown section"), so no game file or trainer can load it
# by mistake; the script checks the header and the label, drops [sim_only] and loads the rest.
# Written by hand on 2026-11-24 (STE L1.5). Same schema as params/starling_physics_v1.toml.
# Sources, read only:
#   A = the simulator's PX4 airframe ~/AirStack-starling-max2/AirStack/simulation/isaac-sim/px4/airframes/
#       10090_pegasus_starling2max, sha256 ec74dd9aff860cef55e2982978b5b9aad17805b0abde88903ad007113a9b9875 (the file the
#       L1.4 session flew, records/2026-11-24_ste_l14_steps_record.md); "A:77" = its line 77; "= real" and "SIM-ONLY" are
#       the airframe's own labels.
#   U = the parameter dump of the L1.4 session's PX4 log (runs/2026-11-24_ste_l14_steps_r3/drone_1_sysid2_03_49_17.ulg,
#       PX4 v1.16.1 SITL): every [gains] value below equals it (float32); "U, PX4 default" = not set by the airframe, so
#       the simulator flew PX4 v1.16.1's default (no parameter changed after logging started).
#   P = the Pegasus plant AirStack/simulation/isaac-sim/extensions/PegasusSimulator/extensions/pegasus.simulator/pegasus/
#       simulator/logic/vehicles/multirotors/starling2max.py, sha256 e63536b25b9da258ad35c6dc40abd0197d516635907a629ff479f01d98003434.
# What tier 2 cannot match (named in the L1.5 spec, not hidden here): THR_MDL_FAC 0.9 (A:90; tier 2 maps u to thrust
#   linearly), the hover-thrust estimator (MPC_USE_HTE 1), Pegasus's input scaling 1350 rad/s per unit command
#   (launch_scripts/launch_env.py:14) against omega_max 1450, the PX4 1.16.1 cascade (tier 2 is a port of 1.14), and
#   EKF2 itself (the simulator fuses simulated GPS: EKF2_GPS_CTRL 7, EKF2_HGT_REF 1; the drone fuses mocap).
# Units: SI, except [gains], which keep PX4's own units (deg, deg/s, Hz) and names (lower case).

[source]
