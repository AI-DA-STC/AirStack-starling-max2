[model]
physics_dt_s = 0.005                      # as tier 2 (D6: 200 Hz, 10 physics steps per 0.05 s tick)
rotor_geometry = "cad"                    # plant rotor positions = A's CA_ROTOR* (the same numbers in the simulator)
motor_lag = false                         # P:15 MOTOR_TIME_CONSTANT_S = 0.0 (STARLING_MOTOR_TAU unset in the L1.4 session) SIM-ONLY
setpoint_delay_s = 0.0                    # D7
upset_tilt_deg = 60.0                     # D10
state_error_pos_m = 0.0                   # off here; compare_sim_steps.py sets the arms (L1.5 spec)
