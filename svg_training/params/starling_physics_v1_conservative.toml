[airframe]                                # CMU system identification of the Starling 2 Max
mass_kg = 0.557                           # kg, body 477 g + 4 x 20 g rotors. MEASURED ../docs/CONFIG.md "Inertials" / CMU sys-ID PDF
inertia_kgm2 = [0.002943, 0.001857, 0.004649] # kg m^2, roll / pitch / yaw. MEASURED ../docs/CONFIG.md "Inertials" / CMU sys-ID PDF
k_f = 3.964738e-6                         # N/(rad/s)^2, rotor thrust. MEASURED ../docs/CONFIG.md "Thrust / motors" / CMU sys-ID PDF
k_m = 5.38697e-8                          # N m/(rad/s)^2, rotor drag torque. MEASURED ../docs/CONFIG.md "Thrust / motors" / CMU sys-ID PDF
omega_max_rad_s = 1450.0                  # rad/s, full rotor speed. MEASURED ../docs/CONFIG.md "Thrust / motors" / CMU sys-ID PDF
tau_up_s = 0.055                          # s, rotor-speed lag speeding up. MEASURED CMU sys-ID PDF "Time Constant" (../isaac_sim/, step response; ../docs/CONFIG.md quotes only their 72 ms mean)
tau_down_s = 0.085                        # s, rotor-speed lag slowing down. MEASURED CMU sys-ID PDF "Time Constant" (../isaac_sim/, step response; ../docs/CONFIG.md quotes only their 72 ms mean)
rotor_xy_cad_m = [[0.095, 0.13], [-0.095, -0.13], [0.095, -0.13], [-0.095, 0.13]] # m, (x fwd, y right) FRD, rotors 0..3. MEASURED ../docs/CONFIG.md "Rotor geometry" (CMU CAD; sim airframe 10090, same order and signs as CA_ROTOR*)

[model]                                   # backend defaults (S2b plan); configs/s2b.toml [physics] overrides them
physics_dt_s = 0.005                      # D6: 200 Hz, 10 physics steps per 0.05 s game tick
rotor_geometry = "cad"                    # D4: plant rotor positions; PX4's allocation always uses [gains] CA_ROTOR*
motor_lag = true                          # D5: first-order rotor-speed lag (tau_up_s / tau_down_s)
setpoint_delay_s = 0.0                    # D7: no transport delay, no estimator
upset_tilt_deg = 60.0                     # D10: tilt past this (or a non-finite state) is an upset
# STE L1.1 / L1.1b: what PX4's cascade sees (models/estimator_effect.py). L1.2: linear body drag (models/starling_airframe.py).
# L1.1b: EKF2's output predictor hands the controllers current-time states, so the estimate is modelled as the true state
# plus a correlated error (state_error_*: first-order Gauss-Markov per quantity, sigma and correlation time tau), not a delay.
state_error_pos_m = 0.0198                # m, per axis. EXPLORATORY: 2 x T63 sigma 0.0099 m (L1.8 conservative)
state_error_pos_tau_s = 1.2               # s. EXPLORATORY: T63 tau (1/e rule) 1.2 s (L1.8 conservative)
state_error_vel_mps = 0.044               # m/s, per axis. EXPLORATORY: 2 x T63 sigma 0.022 m/s (L1.8 conservative)
state_error_vel_tau_s = 1.3               # s. EXPLORATORY: T63 tau (1/e rule) 1.3 s (L1.8 conservative)
state_error_att_rad = 0.0054              # rad, per axis. EXPLORATORY: 2 x T63 sigma 0.0027 rad (L1.8 conservative)
state_error_att_tau_s = 2.0               # s. EXPLORATORY: T63 tau (1/e rule) 2.0 s (L1.8 conservative)
state_delay_att_s = 0.0                   # FIXED at 0 (L1.1b): attitude is never delayed; any other value is refused
state_delay_s = 0.0                       # s, RESIDUAL delay of position and velocity only (WARNING: not the estimator model). At most 0.05 s, a FIXED limit in code (models/physics_params.py STATE_DELAY_MAX_S): the z loop (MPC_Z_P 5 x MPC_Z_VEL_P_ACC 8) went unstable at about 0.117 s of feedback delay in the L1.1 code review's CPU check. OPEN, to be fitted in L1.3. NOT the 0.1482 s delay_s of params/real_exploratory_v0.toml: that is tier 1's lumped delay on the three SETPOINT parts (setpoint -> EKF2's logged estimate; it also absorbs transport, EKF smoothing and any lag tier 1 does not model, records/2026-11-15_s1_real_px4_exploratory.md section 4, "Delay"), and tier 2 already makes part of that lag with its cascade and rotor lag; reusing it here would count it twice
state_noise_pos_m = 0.0                   # m, per axis, per physics step. OPEN, to be fitted in L1.3
state_noise_vel_mps = 0.0                 # m/s, per axis, per physics step. OPEN, to be fitted in L1.3
state_noise_att_rad = 0.0                 # rad, small body rotation per axis, per physics step. OPEN, to be fitted in L1.3
state_noise_rate_rad_s = 0.0              # rad/s, body rates (gyro), per axis, per physics step. OPEN, to be fitted in L1.3
drag_x_n_per_mps = 0.0                    # N per m/s, body x. OPEN (not identified, STANDARDS section 5), to be fitted in L1.3; Pegasus's 0.5 is its Iris default, not a Starling value
drag_y_n_per_mps = 0.0                    # N per m/s, body y. OPEN, to be fitted in L1.3
drag_z_n_per_mps = 0.0                    # N per m/s, body z. OPEN, to be fitted in L1.3
