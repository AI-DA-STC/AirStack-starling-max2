# Tier 2 rigid-body Starling, version 1, conservative estimate-error condition of STE task L1.8. EXPLORATORY.
# A copy of params/starling_physics_v1.toml with ONLY the six state_error_* keys changed (tests/test_ste_tier2_score_l18.py
#   checks that every other section and key equals v1's); v1 itself stays at 0.
# Source of the error values: record T63 (records/2026-11-23_ste_l13_fit_record.md, STE L1.3, EXPLORATORY): EKF2's estimate
#   minus the mocap it fuses, drone_2 log103 hover 81 s; sigma and the 1/e correlation time tau per quantity.
#   Conservative = 2 x T63's sigma with T63's own taus (task L1.8 brief). The flight panel's note in T63 rounds this
#   to 0.02 m / 0.05 m/s / 0.005 rad and adds a tau 0.5 s variant; neither is used here.
#   Not a drone value and not a fitted value: one log, PROPOSED for the lead (STANDARDS section 5). Read by scripts/ste_tier2_score_l18.py.
#
# --- v1's own header follows ---
# Tier 2 rigid-body Starling, version 1. EXPLORATORY: version 0 plus the STE L1.1 / L1.1b estimator effect and the L1.2 drag.
# [source], [gains] and [airframe] are copied verbatim from params/starling_physics_v0.toml (sha256 888f4aea1b5a8440c9685744df62459e9f09cb9907eb8b6a1006c89350a90eb2),
#   which scripts/make_physics_params.py wrote from the drone's own file; v0 is never edited (CODING_PRACTICES section 4).
#   Gains copied from the drone, never tuned (tests/test_estimator_effect.py checks [gains] and [airframe] equal v0's).
# New in [model]: state_delay_s, state_noise_*, drag_* (L1.1, L1.2) and state_error_* (L1.1b). Every one is 0 and OPEN until
#   L1.3 fits them to real flight logs (STANDARDS section 5 rule 10); at 0 the physics drone flies exactly as with v0.
#   Written by hand on 2026-11-22 (L1.1); L1.1b keys and the attitude-delay guard added 2026-11-23.
# Read by source/svg_training/models/physics_params.py (load_physics_params).
# Units: SI, except [gains], which keep PX4's own units (deg, deg/s, Hz) and names (lower case).

